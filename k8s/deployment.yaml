apiVersion: apps/v1
kind: Deployment
metadata:
  name: progapanda-org
  labels:
    app.kubernetes.io/name: progapanda-org
    app.kubernetes.io/instance: progapanda-org
    app.kubernetes.io/version: "1"
spec:
  replicas: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: progapanda-org
      app.kubernetes.io/instance: progapanda-org
  template:
    metadata:
      labels:
        app.kubernetes.io/name: progapanda-org
        app.kubernetes.io/instance: progapanda-org
    spec:
      containers:
        - name: progapanda-org
          image: "docker.io/progapandist/progapanda-org"
          command:
            - ./webterm
          env:
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: DOCKER_HOST
              value: tcp://127.0.0.1:2376
            - name: DOCKER_TLS_CERTDIR
              value: /certs/client
            - name: DOCKER_CERT_PATH
              value: /certs/client
            # Optional on purpose: without the secret the /admin page is not
            # mounted at all, so a missing credential cannot leave it open.
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: webterm-admin
                  key: user
                  optional: true
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: webterm-admin
                  key: password
                  optional: true
          imagePullPolicy: Always
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
          ports:
            - name: http
              containerPort: 4567
              protocol: TCP
          # Keep a pod out of rotation until it can actually serve a visitor:
          # the dind sidecar answering on TLS :2376 *and* holding the visitor
          # image. The sidecar's cache is an emptyDir, so a fresh pod has to
          # pull one — and until it has, `docker run` would silently fall back
          # to whatever the registry's tag pointed at last.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - docker image inspect progapandist/hello2 >/dev/null 2>&1 || docker pull -q progapandist/hello2
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 25
            failureThreshold: 10
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 40m
              memory: 128Mi

        # DIND sidecar
        - name: dind-daemon
          image: docker:stable-dind
          env:
            - name: DOCKER_TLS_CERTDIR
              value: /certs
          securityContext:
            privileged: true
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: docker-graph-storage
              mountPath: /var/lib/docker
          ports:
            - name: docker
              containerPort: 2376
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
              ephemeral-storage: 256Mi

      # Volumes
      volumes:
        # Per-pod, NOT a shared hostPath. Every dind regenerates these certs on
        # startup; when replicas shared one directory they clobbered each
        # other's openssl scratch files, and the loser of the race fell back to
        # plaintext :2375 while webterm kept dialling TLS :2376.
        - name: docker-certs
          emptyDir: {}
        - name: docker-graph-storage
          emptyDir: {}
