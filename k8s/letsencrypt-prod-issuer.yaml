apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod-issuer
spec:
  acme:
    # You must replace this email address with your own.
    # Let's Encrypt will use this to contact you about expiring
    # certificates, and issues related to your account.
    email: andy@lewagon.org
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      # The ACME *account* key, stored in the cert-manager namespace. It shares
      # a name with the certificate secret in the default namespace, which is
      # confusing but harmless — don't rename it, that registers a new ACME
      # account.
      name: progapanda-tls
    # Add a single challenge solver, HTTP01 using traefik
    solvers:
      - http01:
          ingress:
            class: traefik
