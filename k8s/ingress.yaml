apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: progapanda-ingress
  annotations:
    kubernetes.io/ingress.class: "traefik"
    # No cert-manager annotations here on purpose: the Certificate is declared
    # explicitly in cert.yaml. (The old certmanager.k8s.io/* annotations were
    # pre-0.11 naming and had been silently ignored for years.)
spec:
  tls:
    - hosts:
        - progapanda.org
      secretName: progapanda-tls
  rules:
    - host: progapanda.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: progapanda-org-service
                port:
                  number: 80
